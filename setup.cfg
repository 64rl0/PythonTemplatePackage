[flake8]
# E203: Not PEP8, Black adds whitespace before ':'.
# W503: Not PEP8, Black adds line break before binary operator.
ignore = E203,W503
# Set the maximum length that any line (with some exceptions) may be.
max-line-length = 100
# Set the maximum length that a comment or docstring line may be.
max-doc-length = 72
# Docstring style, via flake8-docstrings. Exactly ONE rule is on:
# D213 -- "multi-line docstring summary should start at the second
# line".
# Three things this needs to be right:
#   * `docstring-convention = all` is REQUIRED. The plugin defaults to
#     'pep257', whose code set EXCLUDES D213 -- so selecting D213
#     without this silently matches nothing and the gate never fires.
#   * D212 is D213's EXACT OPPOSITE ("...start at the first line") and
#     is the one that ships in the pep257 default. Never enable both.
#   * `extend-select` alone would ADD D213 to the default D-set. The
#     `D1,D2,D3,D4` ignore turns the whole family off, and the explicit
#     `D213` below re-enables just the one -- a later, narrower rule
#     wins over the broader prefix ignore.
docstring-convention = all
extend-ignore = D1,D2,D3,D4
extend-select = D213
